name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "skills/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "skills/**"
      - ".github/workflows/mcp-server.yml"
  release:
    types: [published]

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Sync skills into package
        run: |
          rm -rf skills
          cp -R ../skills ./skills

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Sync skills into mcp-server context
        run: |
          rm -rf mcp-server/skills
          cp -R skills mcp-server/skills

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: false
          load: true
          tags: cleo-labs/skills-mcp:test
          platforms: linux/amd64

      - name: Smoke-test image (responds to initialize)
        run: |
          # Keep stdin open for 1s after the request so the server has time
          # to flush its response before stdin EOF triggers shutdown.
          response=$(
            ( printf '%s\n' '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}'; sleep 1 ) \
            | docker run --rm -i cleo-labs/skills-mcp:test
          )
          echo "$response"
          echo "$response" | grep -q '"protocolVersion"' || { echo "no protocolVersion in response"; exit 1; }
          echo "$response" | grep -q '"serverInfo"' || { echo "no serverInfo in response"; exit 1; }

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mcp-server-v')
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync skills into package
        run: |
          rm -rf skills
          cp -R ../skills ./skills

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
